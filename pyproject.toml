[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-masking-toolkit"
version = "0.1.0"
description = "Column-level PII controls for PySpark, driven by a YAML policy and audited on every run."
readme = "README.md"
license = "MIT"
authors = [{ name = "Navya Sindhu" }]
requires-python = ">=3.11"
dependencies = [
    "pyspark==4.3.0",
    "cryptography==50.0.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
aws = ["boto3==1.43.123"]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
pii-toolkit = "pii_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pyspark.*"]
